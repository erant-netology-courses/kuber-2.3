apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-svc
  labels:
    app: two-containers
    release: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: two-containers
    release: {{ .Release.Name }}
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
    protocol: TCP